server {
  listen 3022;
  root /usr/share/nginx/html;
  index index.html;

  # Хэшированные ассеты (имя меняется при каждой сборке) — кэшируем надолго.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html и SPA-роуты — НЕ кэшировать: иначе Telegram WebView крутит старый бандл
  # и деплои (downloadFile, фиксы) не доезжают до пользователя.
  location / {
    try_files $uri $uri/ /index.html =404;
    add_header Cache-Control "no-store, must-revalidate";
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
