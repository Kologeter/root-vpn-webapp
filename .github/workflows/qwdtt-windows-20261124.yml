name: ROOT qWDTT native Windows transport 20261124

on:
  push:
    branches: [codex/qwdtt-windows-20261124]
permissions:
  contents: read
concurrency:
  group: root-qwdtt-windows-20261124
  cancel-in-progress: false
jobs:
  native-import:
    name: Native import (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
            asset: Rawline-1.2-windows64.zip
            sha256: aff9074699d92553d46762b169bf7b7e72f624922dbdbf22a93387684b3ad275
          - os: windows-11-arm
            arch: arm64
            asset: Rawline-1.2-windows-arm64.zip
            sha256: 421715c597c276db30acb22cfd0e9942b765467d08a3c5072362d3473aac49cc
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Record native Windows platform
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Output ('WINDOWS_PLATFORM=' + $os.Caption + ' / ' + $os.OSArchitecture)
      - name: Verify official Windows release and native import self-test
        id: official-import
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $ProgressPreference = 'SilentlyContinue'
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'root-qwdtt-official-release'
          $zip = Join-Path $env:RUNNER_TEMP '${{ matrix.asset }}'
          $output = Join-Path $env:RUNNER_TEMP 'root-qwdtt-import.stdout.private'
          $errorLog = Join-Path $env:RUNNER_TEMP 'root-qwdtt-import.stderr.private'
          $process = $null
          $importPassed = $false
          $importExitCode = $null
          $clock = [System.Diagnostics.Stopwatch]::StartNew()
          $phase = 'download'
          Write-Output 'ROOT_QWDTT_WINDOWS_IMPORT_PROGRESS=download'
          try {
            Invoke-WebRequest -Uri 'https://github.com/ttrroyy/Rawline/releases/download/rawline-1.2/${{ matrix.asset }}' -OutFile $zip
            $phase = 'release_integrity'
            Write-Output 'ROOT_QWDTT_WINDOWS_IMPORT_PROGRESS=release_integrity'
            if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '${{ matrix.sha256 }}') { throw 'release_mismatch' }
            $phase = 'extract'
            Write-Output 'ROOT_QWDTT_WINDOWS_IMPORT_PROGRESS=extract'
            Expand-Archive -LiteralPath $zip -DestinationPath $releaseRoot
            $gui = @(Get-ChildItem -LiteralPath $releaseRoot -Filter Rawline.exe -Recurse -File)
            $core = @(Get-ChildItem -LiteralPath $releaseRoot -Filter qwdtt.exe -Recurse -File)
            if ($core.Count -eq 1) {
              ('QWDTT_WINDOWS_CLIENT_PATH=' + $core[0].FullName) >> $env:GITHUB_ENV
              'QWDTT_WINDOWS_CORE_ORIGIN=official-release' >> $env:GITHUB_ENV
            }
            if ($gui.Count -ne 1) { throw 'gui_missing' }
            $phase = 'native_import'
            # Official Windows UI-tour uses its native Windows platform, not Linux offscreen.
            Remove-Item Env:\QT_QPA_PLATFORM -ErrorAction SilentlyContinue
            $env:QT_FORCE_STDERR_LOGGING = '1'
            $env:QT_DEBUG_PLUGINS = '1'
            Write-Output 'ROOT_QWDTT_WINDOWS_IMPORT_PROGRESS=native_windows_selftest'
            $process = Start-Process -FilePath $gui[0].FullName -WorkingDirectory $gui[0].DirectoryName -ArgumentList '--self-test-qwdtt-import' -RedirectStandardOutput $output -RedirectStandardError $errorLog -PassThru
            if (-not $process.WaitForExit(30000)) {
              $phase = 'native_import_timeout'
              throw 'import_timeout'
            }
            $importExitCode = $process.ExitCode
            $importPassed = $importExitCode -eq 0
            if (-not $importPassed) { throw 'import_failed' }
          } catch {
            $failure = [ordered]@{ schema = 1; passed = $false; error = $phase + '_failed'; elapsed_ms = $clock.ElapsedMilliseconds; exit_code = $importExitCode; synthetic_only = $true }
            Write-Output ('ROOT_QWDTT_WINDOWS_IMPORT_REPORT=' + ($failure | ConvertTo-Json -Compress))
          } finally {
            if ($null -ne $process) {
              try { if (-not $process.HasExited) { & "$env:SystemRoot\System32\taskkill.exe" /PID $process.Id /T /F *> $null } } catch { }
              try { $process.Dispose() } catch { }
            }
            # This step receives no profile secret; all input to this test is upstream synthetic fixtures.
            # Emit at most 5000 sanitized characters, JSON-escaped so log commands cannot be injected.
            $diagnostic = ''
            foreach ($logPath in @($output, $errorLog)) {
              try {
                if (Test-Path -LiteralPath $logPath) {
                  $text = [System.IO.File]::ReadAllText($logPath)
                  $diagnostic += [System.Text.RegularExpressions.Regex]::Replace($text, '[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]', ' ')
                }
              } catch { }
            }
            if ($diagnostic.Length -gt 5000) { $diagnostic = $diagnostic.Substring($diagnostic.Length - 5000) }
            Write-Output ('ROOT_QWDTT_WINDOWS_IMPORT_DIAGNOSTIC=' + ([ordered]@{ synthetic_only = $true; tail = $diagnostic } | ConvertTo-Json -Compress))
            Remove-Item Env:\QT_QPA_PLATFORM,Env:\QT_FORCE_STDERR_LOGGING,Env:\QT_DEBUG_PLUGINS -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $zip,$output,$errorLog -Force -ErrorAction SilentlyContinue
          }
          if ($importPassed) {
            Write-Output 'ROOT_QWDTT_WINDOWS_IMPORT_REPORT={"schema":1,"passed":true,"official_release":true,"synthetic_only":true}'
          } else { exit 1 }

